name: build_windows

# A 64-bit Windows build of any branch, to try it out before it is merged or
# released: the portable zip alone, no installer, no tests, no other
# platforms, nothing published. It is the run's one artifact, named after
# the branch and not zipped again, kept for 7 days.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      dev: true
      windows_x64_only: true
